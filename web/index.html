<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeebertyPharmacyAdministration · 药事管理智能 Agent</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">💊</span><div>
      <h1>LeebertyPharmacyAdministration</h1>
      <p class="sub">药事管理智能 Agent · 本地知识库 × 工具 × 可选大模型</p>
    </div></div>
    <div class="top-actions">
      <span class="model-badge" id="modelBadge">🔄 检测中…</span>
      <button class="icon-btn" id="themeBtn" title="切换深浅色主题">🌓</button>
      <button class="icon-btn" id="cfgBtn" title="大模型 API 设置">⚙</button>
      <button class="icon-btn" id="newBtn" title="新建会话">➕</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="side-head">会话历史 <span class="side-count" id="sideCount">0</span></div>
      <div class="side-list" id="sideList"></div>
    </aside>
    <main class="chat-wrap">
      <div class="chat" id="chat"></div>
      <div class="inputbar">
        <textarea id="input" rows="2" placeholder="输入您的问题…（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button id="send">➤ 发送</button>
      </div>
      <div class="hint">输入 GSP自查 / 深度研究 / 模板 / 好评 试试 · 点击回答 👍/👎 可反馈</div>
      <div class="disclaimer" id="disclaimer"></div>
    </main>
  </div>
</div>
<!-- 大模型设置弹窗 -->
<div class="modal-mask" id="llmModal">
  <div class="modal">
    <div class="modal-head"><h2>🤖 大模型 API 设置</h2><button class="modal-close" id="modalClose">✕</button></div>
    <div class="modal-body">
      <p class="tip">支持任意 OpenAI 兼容接口；密钥仅保存在本机 config.json。</p>
      <label>API 地址<input id="cfgBase" placeholder="https://api.deepseek.com/v1"></label>
      <label>API 密钥<input id="cfgKey" type="password" placeholder="sk-..."></label>
      <label>模型名<input id="cfgModel" placeholder="deepseek-chat / gpt-4o-mini / glm-4-flash 等"></label>
      <div class="row2">
        <label>温度<input id="cfgTemp" type="number" step="0.1" min="0" max="2"></label>
        <label>最大输出<input id="cfgTokens" type="number" step="100" min="100" max="8000"></label>
      </div>
      <label class="switch-row"><input type="checkbox" id="cfgEnabled"> 启用 AI 模式（RAG 增强，失败自动回退本地）</label>
      <div class="test-result" id="testResult"></div>
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" id="testBtn">测试连接</button>
      <button class="btn-main" id="saveBtn">保存配置</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
